version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: roomie-redis
    ports:
      - "6379:6379"
    volumes:
      - roomie_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: roomie-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: roomie
      POSTGRES_PASSWORD: roomie
      POSTGRES_DB: roomie
    volumes:
      - roomie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomie -d roomie"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  roomie_redis_data:
  roomie_postgres_data:
