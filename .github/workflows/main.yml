name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project structure
        run: |
          flutter create -t app temp_project
          cp -r frontend/lib/* temp_project/lib/
          cp frontend/pubspec.yaml temp_project/pubspec.yaml
          if [ -d "frontend/assets" ]; then
            cp -r frontend/assets/* temp_project/assets/
          fi

      - name: Update Android Gradle Plugin
        run: |
          cd temp_project/android
          sed -i "s/classpath 'com.android.tools.build:gradle:[0-9.]*'/classpath 'com.android.tools.build:gradle:8.1.4'/" build.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.0'/" build.gradle
          sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.0-bin.zip|" gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get
        working-directory: temp_project

      - name: Build APK
        run: flutter build apk --release
        working-directory: temp_project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roomie-Release-APK
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
